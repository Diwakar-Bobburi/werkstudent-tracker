[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "werkstudent-tracker"
version = "0.2.0"
description = "Daily pipeline tracking Werkstudent AI/ML/Data job postings in Germany"
requires-python = ">=3.10"
dependencies = ["requests>=2.31", "duckdb>=1.1"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
transform = ["dbt-duckdb>=1.8"]

[project.scripts]
tracker = "tracker.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
