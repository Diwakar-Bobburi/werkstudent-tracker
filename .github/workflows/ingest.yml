name: daily-ingest

on:
  schedule:
    - cron: "17 5 * * *"   # 05:17 UTC (10:47 IST); GitHub may start it hours later under load
  workflow_dispatch:        # "Run workflow" button for manual runs
  push:
    branches: [main]
    paths: ["src/**", "tests/**", "transform/**", "pyproject.toml", "requirements.txt"]

permissions:
  contents: write           # needed to commit the new data back to the repo

concurrency:
  group: ingest
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements.txt
      - name: Unit tests
        run: pytest -q
      - name: dbt models + data tests on the data already in the repo
        run: tracker build --no-export

  ingest:
    needs: test
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements.txt

      - name: Ingest
        id: ingest
        run: tracker ingest
        continue-on-error: true   # still commit whatever succeeded

      - name: Transform + data tests + export marts
        id: build
        run: tracker build
        continue-on-error: true

      - name: Commit data
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --cached --quiet && echo "nothing new" && exit 0
          git commit -m "data: ingest $(date -u +%Y-%m-%d)"
          git push

      - name: Fail the run if anything was unhealthy (triggers GitHub email)
        if: steps.ingest.outcome == 'failure' || steps.build.outcome == 'failure'
        run: exit 1
